<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
    <link
      rel="stylesheet"
      href="/Section 02 - Getting Started with Github/css/styles.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/dictando.css" />
  </head>
  <body>
    <h1 class="container">Section 7</h1>
    <section id="notes-viewer" class="max-w-4xl mx-auto mt-8 px-4">
      <div class="flex items-center justify-between mb-4 text-slate-500">
        <div class="flex items-center gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
          <h2 class="text-sm font-bold uppercase tracking-widest">
            Course Notes
          </h2>
        </div>

        <a
          href="../index.html"
          class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest hover:text-emerald-400 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          Home Dashboard
        </a>
      </div>

      <div class="dictando-page rounded-sm max-h-[70vh] overflow-y-auto">
        <div id="notes-content" class="dictando-content"></div>
      </div>
    </section>

    <script>
      window.onload = async function () {
        const display = document.getElementById("notes-content");
        try {
          const response = await fetch(
            "../Notes/Section 07 - Working with an Open Source Project.txt",
          );
          if (!response.ok) throw new Error("🐶 the dog ate my homework! 😢");
          const text = await response.text();
          display.innerText = text;
        } catch (error) {
          display.innerText =
            "❌ I swear it was here! I guess " + error.message;
        }
      };
    </script>
  </body>
</html>
