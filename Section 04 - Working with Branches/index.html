<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>Document</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/dictando.css" />
  </head>
  <body>
    <div class="container">
      <h1>Bootstrap was added to this page</h1>
      <section id="notes-viewer" class="custom-container mx-2 mt-5">
        <div
          class="d-flex align-items-center justify-content-between mb-4 text-secondary"
        >
          <div class="d-flex align-items-center mr-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </svg>
            <h2
              class="small font-weight-bold text-uppercase tracking-widest mb-0"
            >
              Course Notes
            </h2>
          </div>

          <a
            href="../../index.html"
            class="home-link d-flex align-items-center mr-2 small font-weight-bold text-uppercase tracking-widest"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Home Dashboard
          </a>
        </div>

        <div class="dictando-page rounded-1">
          <div id="notes-content" class="dictando-content"></div>
        </div>
      </section>
    </div>

    <script>
      window.onload = async function () {
        const display = document.getElementById("notes-content");
        try {
          const response = await fetch(
            "../../Notes/Section 04 - Working with Branches.txt",
          );
          if (!response.ok) throw new Error("🐶 the dog ate my homework! 😢");
          const text = await response.text();
          display.innerText = text;
        } catch (error) {
          display.innerText =
            "❌ I swear it was here! I guess " + error.message;
        }
      };
    </script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
</html>
